<nav class="h-18 bg-slate-950 relative">
  <div class="container flex items-center w-full h-full mx-auto justify-between px-4">
    <h1 class="uppercase text-purple-600 font-bold text-2xl cursor-pointer">Logo</h1>

    <div class="hidden items-center gap-4 sm:flex">
      @for (link of links; track link.id) {
        <a
          class="text-[16px] font-medium hover:text-purple-600 text-slate-300 cursor-pointer transition-colors duration-200"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <button
      (click)="toggleShowMobileNav()"
      class="flex w-8 h-8 text-slate-300 bg-slate-800 rounded-md sm:hidden items-center justify-center cursor-pointer"
    >
      <svg lucideMenu></svg>
    </button>

    @if (showMobileNav) {
      <div
        class="z-10 flex flex-col gap-3 absolute top-full bg-slate-950 border-t border-slate-700 w-full left-0 p-4"
      >
        @for (link of links; track link.id) {
          <a
            class="text-[16px] font-medium hover:text-purple-600 text-slate-300 cursor-pointer transition-colors duration-200"
          >
            {{ link.label }}
          </a>
        }
      </div>
    }
  </div>
</nav>
